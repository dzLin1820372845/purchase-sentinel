<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调度配置 - 采购舆情监控系统</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Source Han Sans CN", "Noto Sans CJK SC", sans-serif;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.5;
            color: #e0e0e0;
            background: #0f172a;
            min-height: 100vh;
        }

        /* --- Scrollbar --- */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* --- Layout --- */
        .app-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* --- Sidebar --- */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 200px;
            height: 100vh;
            background: #0c1222;
            border-right: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid #1e293b;
        }

        .sidebar-header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-header .subtitle {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            background: rgba(6, 182, 212, 0.08);
            color: #e0e0e0;
        }

        .nav-item.active {
            background: rgba(6, 182, 212, 0.12);
            color: #06b6d4;
            font-weight: 500;
        }

        .nav-item .icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid #1e293b;
            font-size: 11px;
            color: #475569;
        }

        /* --- Main Content --- */
        .main-content {
            flex: 1;
            margin-left: 200px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Top Bar --- */
        .top-bar {
            height: 56px;
            background: #0c1222;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 90;
            gap: 16px;
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }

        .top-bar .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #e0e0e0;
        }

        /* --- Page Content --- */
        .page-content {
            flex: 1;
            padding: 24px;
            max-width: 1200px;
            width: 100%;
        }

        /* --- Cards / Sections --- */
        .card {
            background: #1e293b;
            border: 1px solid #2a3a52;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .icon {
            color: #06b6d4;
            font-size: 18px;
        }

        .card-desc {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        /* --- Form Elements --- */
        .form-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-label {
            color: #94a3b8;
            font-size: 13px;
            white-space: nowrap;
        }

        input[type="text"] {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e0e0e0;
            padding: 8px 12px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            border-color: #06b6d4;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15);
        }

        input[type="text"]::placeholder {
            color: #475569;
        }

        input[type="text"].cron-input {
            width: 200px;
        }

        input[type="text"].name-input {
            width: 160px;
        }

        /* --- Checkbox --- */
        .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #94a3b8;
            font-size: 13px;
        }

        input[type="checkbox"] {
            accent-color: #06b6d4;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* --- Buttons --- */
        button {
            font-family: inherit;
            font-size: 13px;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: #fff;
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #22d3ee, #06b6d4);
            box-shadow: 0 2px 12px rgba(6, 182, 212, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: #94a3b8;
            border: 1px solid #334155;
        }

        .btn-secondary:hover {
            background: rgba(148, 163, 184, 0.08);
            color: #e0e0e0;
            border-color: #475569;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
        }

        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
        }

        /* --- Table --- */
        .table-container {
            background: #1e293b;
            border: 1px solid #2a3a52;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .table-header {
            padding: 16px 20px;
            border-bottom: 1px solid #2a3a52;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-header-title {
            font-size: 16px;
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-header-title .icon {
            color: #06b6d4;
        }

        .table-header-desc {
            color: #64748b;
            font-size: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: #172033;
            color: #64748b;
            font-size: 12px;
            font-weight: 500;
            padding: 12px 16px;
            text-align: left;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #2a3a52;
        }

        tbody tr {
            border-bottom: 1px solid rgba(42, 58, 82, 0.5);
            transition: background 0.15s ease;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: rgba(6, 182, 212, 0.04);
        }

        tbody td {
            padding: 12px 16px;
            font-size: 13px;
            vertical-align: middle;
        }

        td input[type="text"] {
            width: 180px;
        }

        td input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }

        .site-name {
            font-weight: 500;
            color: #e0e0e0;
        }

        .next-run {
            color: #06b6d4;
            font-size: 12px;
            white-space: nowrap;
        }

        .next-run-none {
            color: #475569;
            font-size: 12px;
        }

        .actions-cell {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .loading-state {
            text-align: center;
            padding: 32px;
            color: #64748b;
            font-size: 14px;
        }

        .loading-state .spinner-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #334155;
            border-top-color: #06b6d4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 32px;
            color: #475569;
            font-size: 14px;
        }

        /* --- Toast --- */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            background: #1e293b;
            border: 1px solid #2a3a52;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 13px;
            color: #e0e0e0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transform: translateX(120%);
            transition: transform 0.3s ease;
            pointer-events: auto;
            max-width: 360px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-success {
            border-left: 4px solid #22c55e;
        }

        .toast-error {
            border-left: 4px solid #ef4444;
        }

        .toast-info {
            border-left: 4px solid #06b6d4;
        }

        /* --- Sidebar Overlay (mobile) --- */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* --- Animations --- */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            animation: fadeIn 0.3s ease;
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }

            .hamburger {
                display: block;
            }

            .page-content {
                padding: 16px;
            }

            .form-row {
                gap: 8px;
            }

            input[type="text"].cron-input,
            input[type="text"].name-input {
                width: 140px;
            }

            td input[type="text"] {
                width: 140px;
            }

            .actions-cell {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="app-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>📡 舆情监控</h1>
                <div class="subtitle">采购舆情监控系统</div>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-item">
                    <span class="icon">📊</span>
                    仪表盘
                </a>
                <a href="/schedule" class="nav-item active">
                    <span class="icon">⏱️</span>
                    调度配置
                </a>
            </nav>
            <div class="sidebar-footer">
                v0.1.0
            </div>
        </aside>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <button class="hamburger" id="hamburger-btn" onclick="toggleSidebar()">☰</button>
                <span class="page-title">调度配置</span>
            </header>

            <!-- Page Content -->
            <main class="page-content">
                <!-- Global Default Schedule -->
                <div class="card">
                    <div class="card-title">
                        <span class="icon">⚙️</span>
                        全局默认调度
                    </div>
                    <div class="card-desc">
                        未单独配置的站点将使用此调度策略。修改后所有使用默认调度的未配置站点立即生效。
                    </div>
                    <div class="form-row">
                        <span class="form-label">cron 表达式：</span>
                        <input type="text" id="default-cron" class="cron-input" placeholder="0 9,14,18 * * *" value="0 9,14,18 * * *">
                        <label class="checkbox-wrap">
                            <input type="checkbox" id="default-enabled" checked>
                            启用
                        </label>
                        <button class="btn-primary" onclick="saveDefault()">保存默认</button>
                    </div>
                </div>

                <!-- Add Site Schedule -->
                <div class="card">
                    <div class="card-title">
                        <span class="icon">➕</span>
                        新增站点调度
                    </div>
                    <div class="card-desc">
                        为未配置的站点添加独立的调度策略。
                    </div>
                    <div class="form-row">
                        <span class="form-label">站点名称：</span>
                        <input type="text" id="new-site-name" class="name-input" placeholder="例如：nmpa">
                        <span class="form-label">cron 表达式：</span>
                        <input type="text" id="new-site-cron" class="cron-input" placeholder="0 9,14,18 * * *">
                        <label class="checkbox-wrap">
                            <input type="checkbox" id="new-site-enabled" checked>
                            启用
                        </label>
                        <button class="btn-primary" onclick="addSite()">添加</button>
                    </div>
                </div>

                <!-- Sites Schedule Table -->
                <div class="table-container">
                    <div class="table-header">
                        <div>
                            <div class="table-header-title">
                                <span class="icon">📋</span>
                                站点调度
                            </div>
                            <div class="table-header-desc">每个站点的独立调度策略。空表示跟随全局默认。</div>
                        </div>
                    </div>
                    <div id="loading" class="loading-state">
                        <span class="spinner-icon"></span>
                        加载中...
                    </div>
                    <table id="sites-table" style="display:none">
                        <thead>
                            <tr>
                                <th style="width:180px">站点</th>
                                <th style="width:200px">cron 表达式</th>
                                <th style="width:60px">启用</th>
                                <th style="width:180px">下次运行</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="sites-tbody"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script>
        const API = '/api/schedule';
        let allSites = {};

        // --- Toast ---
        function showToast(message, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.add('show');
            });
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- Sidebar Toggle (mobile) ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        // --- Load ---
        async function load() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('sites-table').style.display = 'none';
            try {
                const res = await fetch(`${API}/sites`);
                const data = await res.json();
                renderDefault(data.default);
                renderSites(data.sites, data.default);
            } catch (e) {
                document.getElementById('loading').innerHTML = '加载失败: ' + escapeHtml(e.message);
            }
        }

        function renderDefault(cfg) {
            document.getElementById('default-cron').value = cfg.cron_expression;
            document.getElementById('default-enabled').checked = cfg.enabled;
        }

        function renderSites(sites, defaultCfg) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('sites-table').style.display = '';
            const tbody = document.getElementById('sites-tbody');
            tbody.innerHTML = '';
            allSites = sites;
            const entries = Object.entries(sites).sort((a, b) => a[0].localeCompare(b[0], 'zh'));
            for (const [name, cfg] of entries) {
                const cron = cfg.cron_expression || defaultCfg.cron_expression;
                const enabled = cfg.enabled !== false;
                const nextRun = cfg.next_run
                    ? new Date(cfg.next_run).toLocaleString('zh-CN')
                    : '—';
                const safeName = encodeURIComponent(name);
                const checkedAttr = enabled ? 'checked' : '';
                const tr = document.createElement('tr');
                tr.setAttribute('data-site', name);
                tr.innerHTML = `
                    <td><span class="site-name">${escapeHtml(name)}</span></td>
                    <td><input type="text" id="cron-${safeName}" value="${escapeHtml(cron || '')}"></td>
                    <td><input type="checkbox" id="en-${safeName}" ${checkedAttr}></td>
                    <td class="next-run">${escapeHtml(nextRun)}</td>
                    <td>
                        <div class="actions-cell">
                            <button class="btn-primary btn-sm" onclick="saveSite('${safeName}', '${escapeHtml(name)}')">保存</button>
                            <button class="btn-secondary btn-sm" onclick="collectNow('${safeName}', '${escapeHtml(name)}')">立即采集</button>
                            <button class="btn-danger btn-sm" onclick="resetSite('${safeName}', '${escapeHtml(name)}')">重置默认</button>
                        </div>
                    </td>`;
                tbody.appendChild(tr);
            }
        }

        async function saveDefault() {
            const cron = document.getElementById('default-cron').value.trim();
            const enabled = document.getElementById('default-enabled').checked;
            try {
                const res = await fetch(`${API}/__default__`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({cron_expression: cron, enabled}),
                });
                if (res.ok) { showToast('全局默认已保存', 'success'); load(); }
                else { const d = await res.json(); showToast('保存失败: ' + (d.error || ''), 'error'); }
            } catch (e) { showToast('保存失败: ' + e, 'error'); }
        }

        async function saveSite(safeName, name) {
            const cron = document.getElementById(`cron-${safeName}`).value.trim();
            const enabled = document.getElementById(`en-${safeName}`).checked;
            try {
                const res = await fetch(`${API}/${safeName}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({cron_expression: cron, enabled}),
                });
                if (res.ok) { showToast(name + ' 已保存', 'success'); load(); }
                else { const d = await res.json(); showToast('保存失败: ' + (d.error || ''), 'error'); }
            } catch (e) { showToast('保存失败: ' + e, 'error'); }
        }

        async function collectNow(safeName, name) {
            try {
                const res = await fetch(`/api/collect/${safeName}`, {method: 'POST'});
                const d = await res.json();
                if (d.status === 'accepted') {
                    showToast(name + ' 采集已开始', 'info');
                } else {
                    showToast('采集失败: ' + (d.detail || d.error || ''), 'error');
                }
            } catch (e) { showToast('采集失败: ' + e, 'error'); }
        }

        async function resetSite(safeName, name) {
            try {
                const res = await fetch(`${API}/${safeName}`, {method: 'DELETE'});
                if (res.ok) { showToast(name + ' 已重置为默认', 'info'); load(); }
                else { const d = await res.json(); showToast('重置失败: ' + (d.error || ''), 'error'); }
            } catch (e) { showToast('重置失败: ' + e, 'error'); }
        }

        async function addSite() {
            const name = document.getElementById('new-site-name').value.trim();
            const cron = document.getElementById('new-site-cron').value.trim();
            const enabled = document.getElementById('new-site-enabled').checked;
            if (!name) { showToast('请输入站点名称', 'error'); return; }
            if (!cron) { showToast('请输入 cron 表达式', 'error'); return; }
            try {
                const res = await fetch(`${API}/${encodeURIComponent(name)}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({cron_expression: cron, enabled}),
                });
                if (res.ok) {
                    showToast('已添加: ' + name, 'success');
                    document.getElementById('new-site-name').value = '';
                    document.getElementById('new-site-cron').value = '';
                    load();
                } else {
                    const d = await res.json();
                    showToast('添加失败: ' + (d.error || ''), 'error');
                }
            } catch (e) { showToast('添加失败: ' + e, 'error'); }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        load();
    </script>
</body>
</html>
