    url: https://www.nmpa.gov.cn
    strategy: sites.nmpa:NMPAStrategy
    enabled: true
    categories:
      - 药品-监管工作
      - 药品-公告通告
      - 药品-法规文件
      - 药品-政策解读
      - 医疗器械-监管工作
      - 医疗器械-公告通知
      - 医疗器械-法规文件
      - 医疗器械-政策解读
      - 医疗器械-飞行检查
      - 医疗器械-召回
      - 化妆品-监管工作
      - 化妆品-法规文件
      - 化妆品-政策解读
      - 化妆品-公告通知
      - 化妆品-抽检通告
      - 化妆品-飞行检查

